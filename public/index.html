<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
</head>

<body>

    <div class="container">
        <h1>QR Generator</h1>

        <form id="qrForm">
            <div class="form-group">
                <label for="text">Text or URL</label>
                <input type="text" id="text" placeholder="https://example.com" required>
            </div>

            <div class="form-group">
                <label for="size">Size (pixels)</label>
                <input type="number" id="size" value="300" min="100" max="4000">
            </div>

            <div class="form-group">
                <label for="colorDark">QR Color</label>
                <input type="color" id="colorDark" value="#000000">
            </div>

            <div class="form-group">
                <label for="ecLevel">Fault Resistance (Error Correction)</label>
                <select id="ecLevel">
                    <option value="L">Low (L) - 7%</option>
                    <option value="M" selected>Medium (M) - 15%</option>
                    <option value="Q">Quartile (Q) - 25%</option>
                    <option value="H">High (H) - 30%</option>
                </select>
            </div>

            <button type="submit">Generate QR Code</button>
        </form>

        <div class="result-container" id="resultContainer">
            <img id="qrImage" src="" alt="Generated QR Code">
            <!-- New Download Button -->
            <button type="button" id="downloadBtn" class="btn-download">Download PNG</button>
        </div>
    </div>
    <script src="./scripts/script.js"></script>
    <footer>
        <h6>Made by <a href="https://nitinarya.in">Nitin Arya</a> | <a href="./privacyPolicy.html">Privacy Policy</a>
        </h6>
    </footer>
</body>

</html>
