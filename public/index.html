<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding: 2rem;
            color: #333;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #0052a3;
        }

        /* Specific styles for the download button */
        .btn-download {
            background-color: #28a745;
            margin-top: 1rem;
        }

        .btn-download:hover {
            background-color: #218838;
        }

        .result-container {
            margin-top: 2rem;
            text-align: center;
            display: none;
            /* Hidden until generated */
        }

        #qrImage {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background-color: #ffffff;
            /* Ensures the border looks good */
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>QR Generator</h1>

        <form id="qrForm">
            <div class="form-group">
                <label for="text">Text or URL</label>
                <input type="text" id="text" placeholder="https://example.com" required>
            </div>

            <div class="form-group">
                <label for="size">Size (pixels)</label>
                <input type="number" id="size" value="300" min="100" max="1000">
            </div>

            <div class="form-group">
                <label for="colorDark">QR Color</label>
                <input type="color" id="colorDark" value="#000000">
            </div>

            <div class="form-group">
                <label for="ecLevel">Fault Resistance (Error Correction)</label>
                <select id="ecLevel">
                    <option value="L">Low (L) - 7%</option>
                    <option value="M" selected>Medium (M) - 15%</option>
                    <option value="Q">Quartile (Q) - 25%</option>
                    <option value="H">High (H) - 30%</option>
                </select>
            </div>

            <button type="submit">Generate QR Code</button>
        </form>

        <div class="result-container" id="resultContainer">
            <img id="qrImage" src="" alt="Generated QR Code">
            <!-- New Download Button -->
            <button type="button" id="downloadBtn" class="btn-download">Download PNG</button>
        </div>
    </div>

    <script>
        document.getElementById('qrForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const text = document.getElementById('text').value;
            const size = document.getElementById('size').value;
            const ecLevel = document.getElementById('ecLevel').value;
            const colorDark = document.getElementById('colorDark').value.substring(1);

            const apiUrl = `/api/qr?text=${encodeURIComponent(text)}&size=${size}&dark=${colorDark}&ecLevel=${ecLevel}`;

            const qrImage = document.getElementById('qrImage');
            const resultContainer = document.getElementById('resultContainer');

            qrImage.src = apiUrl;
            resultContainer.style.display = 'block';
        });

        // New logic to handle the download
        document.getElementById('downloadBtn').addEventListener('click', function () {
            // Get the current URL of the generated image
            const imageSrc = document.getElementById('qrImage').src;

            // Create a temporary, invisible link element
            const link = document.createElement('a');
            link.href = imageSrc;

            // The 'download' attribute tells the browser to save it as a file
            link.download = 'qrcode.png';

            // Append it to the document, click it programmatically, then remove it
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>

</html>
